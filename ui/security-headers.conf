# Response headers applied to every served response.
#
# Kept in its own file because of an nginx footgun: `add_header` directives are
# inherited from the enclosing block *only* when the current block declares none
# of its own. The `/assets/` and `/index.html` locations set their own
# Cache-Control, which would silently drop every header below. Including this
# file in each such block keeps them attached.
#
# `always` so the headers are present on error responses too, not just 2xx.

add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# The console loads no third-party origins, so everything is 'self'. The one
# relaxation is style-src: the React components use inline `style={{...}}`
# props, which land as element style attributes and need 'unsafe-inline'.
# frame-ancestors supersedes X-Frame-Options; both are sent for older browsers.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
