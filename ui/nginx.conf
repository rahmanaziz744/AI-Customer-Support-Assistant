server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json;

    include /etc/nginx/snippets/security-headers.conf;

    # Hashed asset filenames make long caching safe; index.html must not be
    # cached or a deploy would keep serving the previous bundle.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/security-headers.conf;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Same-origin proxy to the API, so the browser needs no CORS preflight and
    # the front end can use relative paths in every environment.
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # The mock order API moves money without passing the eligibility engine or
    # the human-approval gate, so it must not be reachable from a browser. The
    # agent is unaffected: it calls the order API container-to-container over
    # ORDER_API_BASE_URL, which never traverses this proxy.
    #
    # Blocked here as well as at the edge so a local `docker compose up` has the
    # same surface as the deployment.
    location /mock-api/ {
        return 403;
    }

    location /health {
        proxy_pass http://api:8000;
    }

    # Single-page app: unknown paths fall through to the bundle.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
