services:
  db:
    image: pgvector/pgvector:pg16
    container_name: support-agent-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-support}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-support}
      POSTGRES_DB: ${POSTGRES_DB:-support_agent}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-support} -d ${POSTGRES_DB:-support_agent}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Runs migrations and seeds the policy corpus and mock orders, then exits.
  # The API waits for it so a fresh `docker compose up` comes up ready to use.
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment: &api_env
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AGENT_MODEL: ${AGENT_MODEL:-claude-sonnet-5}
      AGENT_EFFORT: ${AGENT_EFFORT:-medium}
      POSTGRES_USER: ${POSTGRES_USER:-support}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-support}
      POSTGRES_DB: ${POSTGRES_DB:-support_agent}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      ORDER_API_BASE_URL: http://api:8000
      LOG_FORMAT: ${LOG_FORMAT:-json}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:8080}
      LANGSMITH_TRACING: ${LANGSMITH_TRACING:-false}
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
      LANGSMITH_PROJECT: ${LANGSMITH_PROJECT:-support-agent}
      FASTEMBED_CACHE_PATH: /opt/fastembed
    command: >
      sh -c "alembic upgrade head && python scripts/seed_db.py"
    restart: "no"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: support-agent-api
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment: *api_env
    ports:
      - "${API_PORT:-8000}:8000"

  ui:
    build:
      context: .
      dockerfile: Dockerfile.ui
    container_name: support-agent-ui
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${UI_PORT:-8080}:80"

volumes:
  pgdata:
